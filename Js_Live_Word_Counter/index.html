<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Character Counter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .counter-box {
      background: white;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body class="d-flex justify-content-center align-items-center vh-100">
  <div class="counter-box text-center w-50">
    <h3 class="mb-3">Live Character & Word Counter</h3>
    <p id="todayDate" class="text-muted mb-4"></p>
    <textarea id="textInput" rows="6" class="form-control mb-3" placeholder="Start typing..."></textarea>
    <p class="mb-1">Characters: <strong id="charCount">0</strong></p>
    <p>Words: <strong id="wordCount">0</strong></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
