<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Text Analyzer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="mb-4 text-center">Text Analyzer</h2>

    <div class="mb-4">
      <textarea id="textInput" class="form-control" rows="8" placeholder="Paste or type your text here..."></textarea>
    </div>

    <div class="row mb-4">
      <div class="col-md-6">
        <h5>Details</h5>
        <ul class="list-group">
          <li class="list-group-item">Words: <strong id="wordCount">0</strong></li>
          <li class="list-group-item">Characters: <strong id="charCount">0</strong></li>
          <li class="list-group-item">Sentences: <strong id="sentenceCount">0</strong></li>
          <li class="list-group-item">Paragraphs: <strong id="paragraphCount">0</strong></li>
          <li class="list-group-item">Reading Time: <strong id="readTime">0 sec</strong></li>
          <li class="list-group-item">Speaking Time: <strong id="speakTime">0 sec</strong></li>
        </ul>
      </div>

      <div class="col-md-6">
        <h5>Keyword Density Settings</h5>
        <div class="form-check form-switch mb-2">
          <input class="form-check-input" type="checkbox" id="toggleDensity" checked>
          <label class="form-check-label" for="toggleDensity">Turn on Keyword Density panel</label>
        </div>

        <div class="mb-2">
          <label for="topN" class="form-label">Show top keywords</label>
          <select id="topN" class="form-select w-auto d-inline-block">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="30">30</option>
          </select>
          <span class="ms-2">keywords in the box</span>
        </div>

        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="countBigrams">
          <label class="form-check-label" for="countBigrams">Find 1 Consecutive Words</label>
        </div>

        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="includeCommon" checked>
          <label class="form-check-label" for="includeCommon">Include common words</label>
        </div>
      </div>
    </div>

    <div class="keyword-table table-responsive">
      <h5>Keyword Density</h5>
      <table class="table table-bordered" id="keywordTable">
        <thead class="table-light">
          <tr>
            <th>Keyword</th>
            <th>Count</th>
            <th>Density (%)</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
