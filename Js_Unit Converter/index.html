<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Universal Unit Converter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="text-center mb-4">Universal Unit Converter</h2>
    <div class="row justify-content-center">
      <div class="col-md-8 bg-white p-4 rounded shadow">
        <div class="mb-3">
          <label for="categorySelect" class="form-label">Choose Category</label>
          <select class="form-select" id="categorySelect" onchange="updateUnits()">
            <option value="length">Length</option>
            <option value="weight">Weight</option>
            <option value="temperature">Temperature</option>
            <option value="speed">Speed</option>
            <option value="area">Area</option>
            <option value="volume">Volume</option>
            <option value="time">Time</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="inputValue" class="form-label">Enter Value</label>
          <input type="number" class="form-control" id="inputValue" placeholder="100">
        </div>

        <div class="row mb-3">
          <div class="col">
            <label for="fromUnit" class="form-label">From</label>
            <select id="fromUnit" class="form-select"></select>
          </div>
          <div class="col">
            <label for="toUnit" class="form-label">To</label>
            <select id="toUnit" class="form-select"></select>
          </div>
        </div>

        <button class="btn btn-primary w-100 mb-3" onclick="convert()">Convert</button>
        <div class="alert alert-success text-center" id="resultBox" style="display: none;"></div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
