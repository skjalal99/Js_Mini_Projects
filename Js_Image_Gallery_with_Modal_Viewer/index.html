<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Image Gallery with Modal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">

  <div class="container py-5">
    <h2 class="text-center mb-4">Image Gallery</h2>
    <div class="row g-3" id="gallery">
      <div class="col-6 col-sm-4 col-md-3">
        <img src="https://picsum.photos/id/1015/300/200" class="img-fluid gallery-img" alt="Nature 1" data-bs-toggle="modal" data-bs-target="#imageModal" data-title="Nature Scene 1"/>
      </div>
      <div class="col-6 col-sm-4 col-md-3">
        <img src="https://picsum.photos/id/1025/300/200" class="img-fluid gallery-img" alt="Nature 2" data-bs-toggle="modal" data-bs-target="#imageModal" data-title="Nature Scene 2"/>
      </div>
      <div class="col-6 col-sm-4 col-md-3">
        <img src="https://picsum.photos/id/1041/300/200" class="img-fluid gallery-img" alt="Nature 3" data-bs-toggle="modal" data-bs-target="#imageModal" data-title="Nature Scene 3"/>
      </div>
      <div class="col-6 col-sm-4 col-md-3">
        <img src="https://picsum.photos/id/1050/300/200" class="img-fluid gallery-img" alt="Nature 4" data-bs-toggle="modal" data-bs-target="#imageModal" data-title="Nature Scene 4"/>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-body p-0">
          <img id="modalImage" src="" class="w-100" alt="Large View"/>
        </div>
        <div class="modal-footer">
          <span id="modalTitle" class="me-auto text-muted"></span>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
