<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Random Quote Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light d-flex flex-column justify-content-center align-items-center vh-100 text-center">

  <div class="container">
    <h1 class="mb-4">Random Quote Generator</h1>
    <div class="card shadow p-4">
      <p id="quote" class="fs-4 mb-3">Click the button to see a quote!</p>
      <button id="generateBtn" class="btn btn-primary">Generate Quote</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
