<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Digital Clock</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body class="bg-dark text-white text-center d-flex flex-column justify-content-center align-items-center vh-100">

  <h1 id="clock" class="display-1 fw-bold">--:--:--</h1>
  <p id="date" class="fs-4">-- -- ----</p>

  <!-- Format Controls -->
  <div class="mt-4">
    <!-- Time format toggle -->
    <div class="form-check form-switch d-inline-block me-3">
      <input class="form-check-input" type="checkbox" id="timeFormatToggle" />
      <label class="form-check-label" for="timeFormatToggle">24-Hour Format</label>
    </div>

    <!-- Date format selector -->
    <label for="dateFormatSelect" class="form-label mt-3">Date Format:</label>
    <select class="form-select d-inline-block w-auto mb-2" id="dateFormatSelect">
      <option value="long" selected>Long Date</option>
      <option value="short">Short Date</option>
      <option value="minimal">Minimal</option>
      <option value="custom">Custom</option>
    </select>

    <!-- Custom format checkboxes -->
    <div id="customDateOptions" class="mt-2 d-none">
      <label class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" id="showDay" checked />
        Day
      </label>
      <label class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" id="showMonth" checked />
        Month
      </label>
      <label class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" id="showYear" checked />
        Year
      </label>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
