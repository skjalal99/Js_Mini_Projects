<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Random Quote Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
</head>
<body class="bg-light text-dark" id="page">

  <div class="container py-5 text-center">
    <h1 class="mb-4">Random Quote Generator</h1>

    <!-- Quote Display -->
    <div class="card shadow p-4 mb-4">
      <p id="quote" class="fs-4">Click the button to get a quote!</p>
      <small id="author" class="text-muted"></small>
    </div>

    <!-- Controls -->
    <button id="generateBtn" class="btn btn-primary mb-3">Get New Quote</button>
    <button id="toggleMode" class="btn btn-secondary mb-3 ms-2">Toggle Dark Mode</button>

    <!-- Custom Quote Form -->
    <div class="card p-4 mt-4">
      <h5>Add Your Own Quote</h5>
      <input type="text" id="customQuote" class="form-control mb-2" placeholder="Enter your quote" />
      <input type="text" id="customAuthor" class="form-control mb-2" placeholder="Author (optional)" />
      <button id="addQuoteBtn" class="btn btn-success">Add Quote</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
